services:
  race-control:
    build: .
    container_name: race-control
    tty: true
    ports:
      - 8080:8080
    restart: always
    env_file:
      - .env
    environment:
      - 'DATABASE_URL=Host=race-control-db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}'
    depends_on:
      race-control-db:
        condition: service_healthy
    volumes:
      - race-control-data:/race-control/storage/
    healthcheck:
      test: ["CMD", "wget", "-no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 1m
      timeout: 3s
  race-control-db:
    image: postgres:18-alpine
    container_name: race-control-db
    volumes:
      - race-control-postgresql-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-race_control}
    env_file: .env
    ports:
      - 4442:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  race-control-data:
  race-control-postgresql-data: